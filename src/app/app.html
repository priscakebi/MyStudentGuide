<router-outlet></router-outlet>

<!--
  Avertissement avant la déconnexion automatique pour inactivité.
  Affiché uniquement quelques secondes avant l'expiration de la session.
-->
@if (idle.warningVisible) {
  <div class="idle-backdrop" role="alertdialog" aria-modal="true" aria-labelledby="idle-title">
    <div class="idle-dialog">
      <h2 id="idle-title">{{ 'inactif.titre' | t }}</h2>
      <p>{{ 'inactif.texte' | t: { s: idle.secondsLeft } }}</p>
      <div class="idle-actions">
        <button type="button" class="idle-btn primary" (click)="idle.stayConnected()">{{ 'inactif.rester' | t }}</button>
        <button type="button" class="idle-btn" (click)="idle.logoutNow()">{{ 'inactif.deconnecter' | t }}</button>
      </div>
    </div>
  </div>
}
