<router-outlet></router-outlet>

<!--
  Avertissement avant la déconnexion automatique pour inactivité.
  Affiché uniquement quelques secondes avant l'expiration de la session.
-->
@if (idle.warningVisible) {
  <div class="idle-backdrop" role="alertdialog" aria-modal="true" aria-labelledby="idle-title">
    <div class="idle-dialog">
      <h2 id="idle-title">Toujours là ?</h2>
      <p>
        Pour votre sécurité, vous allez être déconnecté dans
        <strong>{{ idle.secondsLeft }} s</strong> faute d'activité.
      </p>
      <div class="idle-actions">
        <button type="button" class="idle-btn primary" (click)="idle.stayConnected()">Rester connecté</button>
        <button type="button" class="idle-btn" (click)="idle.logoutNow()">Se déconnecter</button>
      </div>
    </div>
  </div>
}
