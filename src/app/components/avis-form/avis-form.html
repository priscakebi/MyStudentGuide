<div class="avis-backdrop" (click)="fermer()">

  <div
    class="avis-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="avis-title"
    (click)="$event.stopPropagation()"
  >

    <button type="button" class="avis-close" [attr.aria-label]="'commun.fermer' | t" (click)="fermer()">✕</button>

    <span class="avis-label">{{ 'avis.label' | t }}</span>

    <h2 id="avis-title">{{ 'avis.titre' | t }}</h2>

    @if (demarcheTitre) {
      <p class="avis-demarche">{{ demarcheTitre }}</p>
    }

    <form (ngSubmit)="envoyer()">

      <!-- Note en étoiles -->
      <fieldset class="avis-stars" (mouseleave)="survol = 0">
        <legend>{{ 'avis.note' | t }}</legend>

        @for (etoile of etoiles; track etoile) {
          <button
            type="button"
            class="star"
            [class.filled]="etoile <= (survol || note)"
            [attr.aria-label]="(etoile > 1 ? 'avis.etoile.n' : 'avis.etoile.1') | t: { n: etoile }"
            [attr.aria-pressed]="note === etoile"
            (mouseenter)="survol = etoile"
            (click)="note = etoile"
          >★</button>
        }

        <span class="star-caption">{{ libelle(survol || note) }}</span>
      </fieldset>

      <!-- Commentaire -->
      <label for="avis-commentaire">{{ 'avis.commentaire' | t }}</label>
      <textarea
        id="avis-commentaire"
        name="commentaire"
        rows="5"
        maxlength="1000"
        [placeholder]="'avis.placeholder' | t"
        [(ngModel)]="commentaire"
      ></textarea>

      <div class="avis-meta">
        <span>{{ 'avis.affichage' | t }}</span>
        <span>{{ commentaire.length }}/1000</span>
      </div>

      @if (erreur) {
        <p class="avis-error" role="alert">{{ erreur }}</p>
      }

      <div class="avis-actions">
        <button type="button" class="btn-secondary" [disabled]="envoi" (click)="fermer()">
          {{ 'commun.annuler' | t }}
        </button>
        <button type="submit" class="btn-primary" [disabled]="envoi || note < 1 || !commentaireValide">
          {{ (envoi ? 'avis.envoi' : 'avis.publier') | t }}
        </button>
      </div>

    </form>

  </div>

</div>
