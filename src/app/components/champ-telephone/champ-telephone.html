<div class="telephone">

  <select
    [id]="inputId() + '-pays'"
    class="pays"
    [attr.aria-label]="'telephone.pays' | t"
    [value]="pays()"
    [disabled]="desactive()"
    (change)="choisirPays($any($event.target).value)"
  >
    @for (p of listePays(); track p.code) {
      <option [value]="p.code" [selected]="p.code === pays()">+{{ p.indicatif }} · {{ p.nom }}</option>
    }
  </select>

  <input
    [id]="inputId()"
    type="tel"
    inputmode="tel"
    autocomplete="tel-national"
    maxlength="25"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-required]="required() || null"
    [placeholder]="placeholder()"
    [value]="numero()"
    [disabled]="desactive()"
    (input)="saisir($any($event.target).value)"
    (blur)="quitter()"
  />

</div>
