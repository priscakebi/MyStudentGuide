<!--
  ==========================================================
  LAYOUT PUBLIC DE MYSTUDENTGUIDE
  ==========================================================

  Ce layout contient les éléments communs aux pages
  publiques de l'application :

  - lien « Aller au contenu » (navigation au clavier)
  - Navbar
  - contenu de la page, dans l'unique <main> de la page
  - Footer

  IMPORTANT :
  Le Dashboard n'est pas affiché dans ce layout.
  Il possède son propre layout avec sa sidebar.
-->

<a class="skip-link" href="#contenu" (click)="allerAuContenu($event)">{{ 'nav.allerAuContenu' | t }}</a>


<!-- ======================================================== -->
<!-- NAVBAR                                                   -->
<!-- ======================================================== -->

<app-navbar></app-navbar>



<!-- ======================================================== -->
<!-- CONTENU DE LA PAGE                                      -->
<!-- ======================================================== -->

<!--
  Angular affiche ici la page correspondant
  à la route publique actuelle (/home, /demarches, /documents…).

  Les pages n'ont donc pas leur propre <main> : une seule zone
  principale par page pour les lecteurs d'écran.
-->
<main id="contenu" tabindex="-1">
  <router-outlet></router-outlet>
</main>



<!-- ======================================================== -->
<!-- FOOTER                                                   -->
<!-- ======================================================== -->

<app-footer></app-footer>
