<div class="admin-login-page">
  <section class="admin-login-card">

    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M12 3l8 3v6c0 4.5-3.2 8.3-8 9-4.8-.7-8-4.5-8-9V6l8-3Z" />
        <path d="M9 12l2 2 4-4" />
      </svg>
    </div>

    <h1>MyStudentGuide</h1>
    <h2>Espace administrateur</h2>
    <p class="description">
      Connexion réservée à l'équipe de gestion de la plateforme.
    </p>

    <form (ngSubmit)="onLogin()">

      <div class="form-group">
        <label for="admin-email">Adresse e-mail</label>
        <input
          id="admin-email"
          type="email"
          name="email"
          autocomplete="username"
          [(ngModel)]="email"
          placeholder="admin@exemple.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="admin-password">Mot de passe</label>

        <div class="password-container">
          <input
            id="admin-password"
            [type]="passwordVisible ? 'text' : 'password'"
            name="password"
            autocomplete="current-password"
            [(ngModel)]="password"
            placeholder="Votre mot de passe"
            required
          >

          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
          >
            {{ passwordVisible ? 'Masquer' : 'Afficher' }}
          </button>
        </div>
      </div>

      <p class="forgot-link">
        <a routerLink="/admin-forgot-password">Mot de passe oublié ?</a>
      </p>

      @if (infoMessage) {
        <p class="info" role="status">{{ infoMessage }}</p>
      }

      @if (errorMessage) {
        <p class="error" role="alert">{{ errorMessage }}</p>
      }

      <button type="submit" class="login-button" [disabled]="loading">
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>

      <p class="student-link">
        Vous êtes étudiant ?
        <a routerLink="/login">Connexion étudiant</a>
      </p>

    </form>
  </section>
</div>
